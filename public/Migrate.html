<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nubi – D1 Migration</title>
</head>

<body style="font-family:Arial;padding:30px;max-width:500px;margin:auto;">
  <h2>Nubi – Airtable → D1</h2>

  <p>Admin-PIN eingeben:</p>

  <input
    id="pin"
    type="password"
    inputmode="numeric"
    placeholder="Admin-PIN"
    style="padding:12px;width:100%;box-sizing:border-box;"
  >

  <br><br>

  <button
    onclick="migrateBlocks()"
    style="padding:14px 20px;font-size:16px;width:100%;"
  >
    Sperren nach D1 übertragen
  </button>

  <br><br>

  <button
    onclick="migrateBookings()"
    style="padding:14px 20px;font-size:16px;width:100%;"
  >
    Reservierungen nach D1 übertragen
  </button>

  <p id="result" style="margin-top:20px;"></p>

  <script>
    async function callMigration(url, successText) {
      const result = document.getElementById("result");
      const pin = document.getElementById("pin").value;

      result.textContent = "Übertragung läuft…";

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ pin })
        });

        const data = await response.json();

        if (!response.ok) {
          result.textContent =
            "❌ " +
            (data.error || "Übertragung fehlgeschlagen.") +
            (data.details ? " – " + data.details : "");
          return;
        }

        result.textContent =
          `✅ ${successText}: ${data.imported} übertragen. ` +
          `${data.ignored} leere/ungültige Einträge ignoriert.`;

      } catch (error) {
        result.textContent = "❌ Übertragung fehlgeschlagen.";
      }
    }

    function migrateBlocks() {
      callMigration(
        "/api/migrate-blocks",
        "Sperren fertig"
      );
    }

    function migrateBookings() {
      callMigration(
        "/api/migrate-bookings",
        "Reservierungen fertig"
      );
    }
  </script>
</body>
</html>
