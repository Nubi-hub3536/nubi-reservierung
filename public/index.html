<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nubi Mainz – Platz reservieren</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff8f6;
      color: #333;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .slot {
      border: 2px solid #eee;
      background: #fff;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
    }

    .slot.selected {
      border-color: #333;
      background: #fff0ec;
    }

    .slot:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 18px;
    }

    .check input {
      width: auto;
      margin-top: 4px;
      transform: scale(1.2);
    }

    .check label {
      margin: 0;
      font-weight: normal;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      display: none;
    }

    #message.success {
      display: block;
      background: #e9f8ee;
    }

    #message.error {
      display: block;
      background: #ffeaea;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">

    <h1>Platz reservieren 🎀</h1>
    <div class="subtitle">Nubi Mainz – Make it cute</div>

    <form id="bookingForm">

      <label for="date">Datum *</label>
      <input id="date" type="date" required>

      <label>Uhrzeit *</label>
      <div id="slots" class="slots">
        Bitte zuerst ein Datum auswählen.
      </div>

      <input id="time" type="hidden">

      <label for="people">Personen *</label>
      <select id="people" required>
        <option value="">Bitte auswählen</option>
        <option value="1">1 Person</option>
        <option value="2">2 Personen</option>
        <option value="3">3 Personen</option>
        <option value="4">4 Personen</option>
        <option value="5">5 Personen</option>
        <option value="6">6 Personen</option>
        <option value="7">7 Personen</option>
        <option value="8">8 Personen</option>
      </select>

      <label for="name">Name *</label>
      <input id="name" type="text" required>

      <label for="email">E-Mail *</label>
      <input id="email" type="email" required>

      <label for="phone">Telefonnummer *</label>
      <input id="phone" type="tel" required>

      <label for="note">Notiz</label>
      <textarea id="note"></textarea>

      <div class="check">
        <input id="cash" type="checkbox" required>
        <label for="cash">
          Ich habe zur Kenntnis genommen, dass ausschließlich Barzahlung möglich ist.
        </label>
      </div>

      <div class="check">
        <input id="caseChecked" type="checkbox" required>
        <label for="caseChecked">
          Ich habe auf der Webseite geprüft, ob mein Handymodell aufgeführt ist. Falls nicht, bringe ich eine eigene transparente Hülle mit und spare 5 €.
        </label>
      </div>

      <div class="check">
        <input id="safety" type="checkbox" required>
        <label for="safety">
         Ich habe die <a href="https://www.nubimainz.de/allgemeine-sicherheitshinweise" target="_blank">Sicherheits- & Materialhinweise</a> gelesen und zur Kenntnis genommen.
        </label>
      </div>

      <button id="submitButton" type="submit">
        Platz reservieren
      </button>

      <div id="message"></div>

    </form>
  </div>
</div>

<script>
  const dateInput = document.getElementById("date");
  const timeInput = document.getElementById("time");
  const peopleSelect = document.getElementById("people");
  const slotsElement = document.getElementById("slots");
  const form = document.getElementById("bookingForm");
  const message = document.getElementById("message");
  const submitButton = document.getElementById("submitButton");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "";
  }

  async function loadAvailability() {
    clearMessage();

    const date = dateInput.value;

    if (!date) return;

    slotsElement.innerHTML = "Verfügbarkeit wird geladen …";
    timeInput.value = "";

    try {
      const response = await fetch(
        `/api/availability?date=${encodeURIComponent(date)}`
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Fehler");
      }

      slotsElement.innerHTML = "";

      if (!data.times || data.times.length === 0) {
        slotsElement.innerHTML =
          "An diesem Tag sind keine Termine verfügbar.";
        return;
      }

      data.times.forEach(slot => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "slot";
        button.dataset.time = slot.time;
        button.dataset.remaining = slot.remaining;

        button.innerHTML =
          `<strong>${slot.time} Uhr</strong><br>
           <small>${slot.remaining} von ${slot.capacity} Plätzen frei</small>`;

        if (!slot.available) {
          button.disabled = true;
        }

        button.addEventListener("click", () => {
          document
            .querySelectorAll(".slot")
            .forEach(item => item.classList.remove("selected"));

          button.classList.add("selected");
          timeInput.value = slot.time;
          updatePeopleOptions();
        });

        slotsElement.appendChild(button);
      });

    } catch (error) {
      showMessage(
        "Die Verfügbarkeit konnte nicht geladen werden.",
        "error"
      );
    }
  }

  function updatePeopleOptions() {
    const selected = document.querySelector(".slot.selected");
    let remaining = 8;

    if (selected) {
      remaining = Number(selected.dataset.remaining);
    }

Array.from(peopleSelect.options).forEach(option => {
  if (!option.value) return;
  option.disabled = Number(option.value) > remaining;
});
    if (
  peopleSelect.value &&
  Number(peopleSelect.value) > remaining
) {
  peopleSelect.value = "";
}
}

  dateInput.addEventListener("change", loadAvailability);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    clearMessage();

    if (!timeInput.value) {
      showMessage("Bitte wähle eine Uhrzeit aus.", "error");
      return;
    }

    const booking = {
      date: dateInput.value,
      time: timeInput.value,
      persons: Number(peopleSelect.value),
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      note: document.getElementById("note").value.trim(),

      cashConfirmed:
        document.getElementById("cash").checked,

      phoneChecked:
        document.getElementById("caseChecked").checked,

      safetyConfirmed:
        document.getElementById("safety").checked
    };

    submitButton.disabled = true;
    submitButton.textContent = "Reservierung wird gespeichert …";

    try {
      const response = await fetch("/api/book", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(booking)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Reservierung konnte nicht gespeichert werden."
        );
      }

      form.reset();
      timeInput.value = "";

      showMessage(
        "🎀 Deine Reservierung wurde erfolgreich gespeichert.",
        "success"
      );

    } catch (error) {
      showMessage(error.message, "error");

    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Platz reservieren";
    }
  });
</script>

</body>
</html>
