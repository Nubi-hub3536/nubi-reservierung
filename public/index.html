<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nubi Mainz – Platz reservieren</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 22px 14px 40px;
      font-family: Arial, sans-serif;
      color: #4d3565;
      background:
        radial-gradient(circle at 15% 10%, #ffd9ec 0 8%, transparent 9%),
        radial-gradient(circle at 90% 18%, #d9c9ff 0 8%, transparent 9%),
        linear-gradient(180deg, #f8e8ff 0%, #fff1f7 45%, #eef6ff 100%);
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -5px;
      line-height: 1;
      text-shadow:
        0 3px 0 #fff,
        0 5px 12px rgba(102, 61, 147, 0.18);
    }

    .n1 { color: #ff75b7; }
    .u  { color: #65c7f3; }
    .b  { color: #a984ef; }
    .i  { color: #ff8bc4; }

    .star {
      display: inline-block;
      margin-left: 4px;
      color: #ffd44d;
      font-size: 28px;
      transform: translateY(-22px) rotate(10deg);
      text-shadow: 0 2px 0 #fff;
    }

    .tagline {
      margin-top: 8px;
      font-weight: 700;
      color: #9465c5;
      letter-spacing: .4px;
    }

    .card {
      background: rgba(255,255,255,0.94);
      border: 3px solid #f5c9e5;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow:
        0 12px 35px rgba(154, 112, 193, 0.16),
        inset 0 0 0 3px #fff;
    }

    .title-box {
      text-align: center;
      margin-bottom: 24px;
      padding: 18px 12px;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffe1ef, #eee2ff);
      border: 2px dashed #e6a9d2;
    }

    h1 {
      margin: 0 0 6px;
      color: #d64c9f;
      font-size: 30px;
    }

    .subtitle {
      color: #76549a;
      font-weight: 700;
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 17px;
      margin-bottom: 7px;
      color: #674a86;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #ead7f4;
      border-radius: 15px;
      font-size: 16px;
      background: #fff;
      color: #43334f;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d88ec1;
      box-shadow: 0 0 0 4px rgba(216,142,193,.14);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      margin-top: 10px;
    }

    .slot {
      border: 2px solid #e5d4f2;
      background: linear-gradient(180deg, #fff, #fff5fb);
      padding: 13px 8px;
      border-radius: 16px;
      cursor: pointer;
      text-align: center;
      color: #694a88;
      font-size: 15px;
    }

    .slot strong {
      color: #d54a9d;
      font-size: 17px;
    }

    .slot.selected {
      border-color: #a678df;
      background: linear-gradient(135deg, #ffdff0, #e9ddff);
      box-shadow: 0 4px 14px rgba(166,120,223,.18);
    }

    .slot:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .check {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin-top: 19px;
      padding: 13px;
      border-radius: 15px;
      background: #fff8fc;
      border: 1px solid #f3d8e9;
    }

    .check input {
      width: auto;
      margin-top: 4px;
      transform: scale(1.25);
      accent-color: #d950a2;
    }

    .check label {
      margin: 0;
      font-weight: normal;
      color: #574566;
      line-height: 1.45;
    }

    a {
      color: #b353c8;
      font-weight: 700;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 26px;
      padding: 16px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(90deg, #ef67ad, #a978e8, #65bdf1);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(171, 103, 200, .25);
    }

    button[type="submit"]:disabled {
      opacity: .65;
    }

    #message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      display: none;
      text-align: center;
      font-weight: 700;
    }

    #message.success {
      display: block;
      background: #e7f8ef;
      color: #29734b;
    }

    #message.error {
      display: block;
      background: #ffe8ee;
      color: #a33454;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      color: #9a79b5;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 48px;
      }

      h1 {
        font-size: 27px;
      }

      .card {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
  <img src="nubi-logo.png" alt="Nubi Mainz" style="display:block;width:220px;max-width:80%;height:auto;margin:0 auto 10px;">
  <div class="tagline">Make it cute ✨</div>
</div>
  </div>

  <div class="card">

    <div class="title-box">
      <h1>Platz reservieren 🎀</h1>
      <div class="subtitle">
        Dein kreativer Termin bei Nubi Mainz
      </div>
    </div>

    <form id="bookingForm">

      <label for="date">Datum *</label>
      <input id="date" type="date" required>

      <label>Uhrzeit *</label>
      <div id="slots" class="slots">
        Bitte zuerst ein Datum auswählen.
      </div>

      <input id="time" type="hidden">

      <label for="people">Personen *</label>
      <select id="people" required>
        <option value="">Bitte auswählen</option>
        <option value="1">1 Person</option>
        <option value="2">2 Personen</option>
        <option value="3">3 Personen</option>
        <option value="4">4 Personen</option>
        <option value="5">5 Personen</option>
        <option value="6">6 Personen</option>
        <option value="7">7 Personen</option>
        <option value="8">8 Personen</option>
      </select>

      <label for="name">Name *</label>
      <input id="name" type="text" required>

      <label for="email">E-Mail *</label>
      <input id="email" type="email" required>

      <label for="phone">Telefonnummer *</label>
      <input id="phone" type="tel" required>

      <label for="note">Notiz</label>
      <textarea id="note"></textarea>

      <div class="check">
        <input id="cash" type="checkbox" required>
        <label for="cash">
          Ich habe zur Kenntnis genommen, dass ausschließlich Barzahlung möglich ist.
        </label>
      </div>

      <div class="check">
        <input id="caseChecked" type="checkbox" required>
        <label for="caseChecked">
          Ich habe auf der Webseite geprüft, ob mein Handymodell aufgeführt ist. Falls nicht, bringe ich eine eigene transparente Hülle mit und spare 5 €.
        </label>
      </div>

      <div class="check">
        <input id="safety" type="checkbox" required>
        <label for="safety">
          Ich habe die
          <a href="https://www.nubimainz.de/allgemeine-sicherheitshinweise" target="_blank">
            Sicherheits- & Materialhinweise
          </a>
          gelesen und zur Kenntnis genommen.
        </label>
      </div>

      <button id="submitButton" type="submit">
        Platz reservieren
      </button>

      <div id="message"></div>

    </form>
  </div>

  <div class="footer-note">
    🎀 Kreativ · Bunt · Einzigartig · Nubi Mainz
  </div>

</div>

<script>
  const dateInput = document.getElementById("date");
  const timeInput = document.getElementById("time");
  const peopleSelect = document.getElementById("people");
  const slotsElement = document.getElementById("slots");
  const form = document.getElementById("bookingForm");
  const message = document.getElementById("message");
  const submitButton = document.getElementById("submitButton");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "";
  }

  async function loadAvailability() {
    clearMessage();

    const date = dateInput.value;

    if (!date) return;

    slotsElement.innerHTML = "Verfügbarkeit wird geladen …";
    timeInput.value = "";

    try {
      const response = await fetch(
        `/api/availability?date=${encodeURIComponent(date)}`
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Fehler");
      }

      slotsElement.innerHTML = "";

      if (!data.times || data.times.length === 0) {
        slotsElement.innerHTML =
          "An diesem Tag sind keine Termine verfügbar.";
        return;
      }

      data.times.forEach(slot => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "slot";
        button.dataset.time = slot.time;
        button.dataset.remaining = slot.remaining;

        button.innerHTML =
          `<strong>${slot.time} Uhr</strong><br>
           <small>${slot.remaining} von ${slot.capacity} Plätzen frei</small>`;

        if (!slot.available) {
          button.disabled = true;
        }

        button.addEventListener("click", () => {
          document
            .querySelectorAll(".slot")
            .forEach(item => item.classList.remove("selected"));

          button.classList.add("selected");
          timeInput.value = slot.time;
          updatePeopleOptions();
        });

        slotsElement.appendChild(button);
      });

    } catch (error) {
      showMessage(
        "Die Verfügbarkeit konnte nicht geladen werden.",
        "error"
      );
    }
  }

  function updatePeopleOptions() {
    const selected = document.querySelector(".slot.selected");
    let remaining = 8;

    if (selected) {
      remaining = Number(selected.dataset.remaining);
    }

    Array.from(peopleSelect.options).forEach(option => {
      if (!option.value) return;
      option.disabled = Number(option.value) > remaining;
    });

    if (
      peopleSelect.value &&
      Number(peopleSelect.value) > remaining
    ) {
      peopleSelect.value = "";
    }
  }

  dateInput.addEventListener("change", loadAvailability);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    clearMessage();

    if (!timeInput.value) {
      showMessage("Bitte wähle eine Uhrzeit aus.", "error");
      return;
    }

    const booking = {
      date: dateInput.value,
      time: timeInput.value,
      persons: Number(peopleSelect.value),
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      note: document.getElementById("note").value.trim(),

      cashConfirmed:
        document.getElementById("cash").checked,

      phoneChecked:
        document.getElementById("caseChecked").checked,

      safetyConfirmed:
        document.getElementById("safety").checked
    };

    submitButton.disabled = true;
    submitButton.textContent = "Reservierung wird gespeichert …";

    try {
      const response = await fetch("/api/book", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(booking)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Reservierung konnte nicht gespeichert werden."
        );
      }

      form.reset();
      timeInput.value = "";

      showMessage(
        "🎀 Deine Reservierung wurde erfolgreich gespeichert.",
        "success"
      );

    } catch (error) {
      showMessage(error.message, "error");

    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Platz reservieren";
    }
  });
</script>

</body>
</html>
